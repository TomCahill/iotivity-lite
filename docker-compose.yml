version: '3.8'

services:
  cloud-server-debug-single:
    build:
      context: .
      dockerfile: docker/apps/Dockerfile.cloud-server-debug-single
      platforms:
        - linux/arm64
    image: hub.foundries.io/dynamic-devices/cloud-server-debug-single:latest
    container_name: cloud-server-debug-single
    restart: unless-stopped
    ports:
      - "5683:5683/udp"
      - "5684:5684/udp"
      - "5683:5683/tcp"
      - "5684:5684/tcp"
    networks:
      - iotivity-net
  ocf-onboarding-tool:
    build:
      context: .
      dockerfile: docker/apps/Dockerfile.onboarding-tool
      platforms:
        - linux/arm64
    image: hub.foundries.io/dynamic-devices/ocf-onboarding-tool:latest
    container_name: ocf-onboarding-tool
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - iotivity-net

networks:
  iotivity-net:
    driver: bridge # 'bridge' is the standard driver for a single host